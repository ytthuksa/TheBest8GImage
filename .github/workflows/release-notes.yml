name: Sync release notes

# 把 .github/release-notes/<tag>.md 的内容同步到同名 GitHub Release 的正文。
# 改一次文件就更新一次正文，不需要本地 token。
on:
  push:
    paths:
      - '.github/release-notes/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync notes to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in .github/release-notes/*.md; do
            tag="$(basename "$f" .md)"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$f"
              echo "updated release $tag from $f"
            else
              echo "skip $tag (no such release)"
            fi
          done
